    <style>
      :root{font-family:Georgia,"Times New Roman",serif;color:#262920;background:#f4f3ee}*{box-sizing:border-box}body{margin:0}.wrap{max-width:760px;margin:0 auto;padding:10vh 28px 80px;animation:enter .6s cubic-bezier(.2,.7,.2,1) both}.mark{display:flex;align-items:center;gap:10px;font:650 12px/1.5 system-ui,sans-serif;letter-spacing:-.03em;color:#3d5541}.reader-logo{width:34px;height:34px;filter:drop-shadow(0 3px 7px #274d3825);animation:logo .8s cubic-bezier(.16,1,.3,1) both}.reader-logo path{stroke-dasharray:100;animation:draw 1.4s .2s ease-out both}.reader-logo circle{transform-box:fill-box;transform-origin:center;animation:pulse-node 3.4s 1.2s ease-in-out infinite}.rule{height:1px;background:#dcdcd3;margin:20px 0 42px}.state{font:12px/1.6 system-ui,sans-serif;color:#77786e}.state:not(.error)::before{content:"";display:inline-block;width:8px;height:8px;margin-right:9px;border-radius:50%;background:#789475;animation:pulse 1.2s ease-in-out infinite alternate}.state.error{color:#9e4e3e}h1{font:600 clamp(38px,8vw,66px)/1.07 system-ui,sans-serif;letter-spacing:-.06em;margin:12px 0 13px}.byline{font:12px/1.6 system-ui,sans-serif;color:#72746a}.content{font:18px/1.9 Georgia,serif;margin:45px 0;color:#3f4139}.content p{margin:0 0 1.4em}.foot{border-top:1px solid #dcdcd3;padding-top:18px;color:#77786e;font:11px/1.7 system-ui,sans-serif}.foot a{color:#456c50}.mark, .state, .byline, .foot{overflow-wrap:anywhere}#post{animation:enter .45s cubic-bezier(.2,.7,.2,1) both}.foot a:hover{color:#244b34}@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes pulse{to{opacity:.35;transform:scale(.8)}}@keyframes logo{from{opacity:.4;transform:scale(.78) rotate(-12deg)}to{opacity:1;transform:scale(1) rotate(0)}}@keyframes draw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}@keyframes pulse-node{50%{transform:scale(1.16)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
